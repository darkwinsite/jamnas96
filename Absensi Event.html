<html lang="id"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Event</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17261f;--mute:#5d6e65;--line:#d5ded9;--accent:#0f6b4f;--accent-ink:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#18251e;--ink:#e8f1ec;--mute:#93a69b;--line:#2b3c33;--accent:#4cc79b;--accent-ink:#06261a;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a15;--card:#18251e;--ink:#e8f1ec;--mute:#93a69b;--line:#2b3c33;--accent:#4cc79b;--accent-ink:#06261a;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:380px 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.photo{display:flex;gap:12px;align-items:center;margin-top:4px}
.preview{width:84px;height:84px;border-radius:12px;border:1px dashed var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:.75rem;text-align:center;flex:none}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;margin-top:18px;padding:12px}
button.small{padding:6px 10px;font-size:.85rem}
button.del{color:var(--danger)}
.msg{min-height:1.4em;margin:10px 0 0;font-size:.9rem;color:var(--danger)}
.msg.ok{color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:140px}
.count{font-weight:700;font-size:1.05rem;margin:0 0 12px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.item img,.item .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;color:var(--mute);font-weight:700}
.info{flex:1;min-width:0}
.info b{display:block;overflow-wrap:anywhere}
.info span{display:block;color:var(--mute);font-size:.85rem;overflow-wrap:anywhere}
.empty{color:var(--mute);text-align:center;padding:28px 8px}
</style>
</head>
<body>
<main>
  <h1>Absensi Event</h1>
  <p class="sub">Isi data peserta, ambil foto, lalu simpan kehadiran.</p>
  <div class="grid">
    <section class="card" aria-label="Form absensi">
      <div>
        <label for="nama">Nama lengkap</label>
        <input id="nama" autocomplete="name" placeholder="Contoh: Budi Santoso">
        <label for="kota">Asal kota</label>
        <input id="kota" placeholder="Contoh: Bandung">
        <label for="alamat">Alamat</label>
        <textarea id="alamat" placeholder="Jalan, nomor, kelurahan"></textarea>
        <label for="kontak">Kontak (no. HP / email)</label>
        <input id="kontak" inputmode="tel" placeholder="Contoh: 0812xxxxxxx">
        <label for="foto">Foto peserta</label>
        <div class="photo">
          <div class="preview" id="preview" style="">Belum ada foto</div>
          <div>
            <input type="file" id="foto" accept="image/*" capture="user" style="padding:6px">
          </div>
        </div>
        <button class="primary" id="simpan" type="button">Simpan kehadiran</button>
        <p class="msg ok" id="msg" role="status">Budi Santoso tercatat hadir.</p>
      </div>
    </section>

    <section class="card" aria-label="Daftar hadir">
      <p class="count" id="count">Peserta hadir: 2</p>
      <div class="bar">
        <input id="cari" type="search" placeholder="Cari nama, kota, atau kontak">
        <button class="small" id="salin" type="button">Salin data (CSV)</button>

<script>
(function(){
  var KEY="absensi-event-v1", data=[], foto="";
  var $=function(id){return document.getElementById(id)};
  try{ data=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(data)) data=[]; }catch(e){ data=[]; }

  function persist(){
    try{ localStorage.setItem(KEY,JSON.stringify(data)); return true; }catch(e){ return false; }
  }
  function say(t,ok){ var m=$("msg"); m.textContent=t; m.className="msg"+(ok?" ok":""); }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  // Perkecil foto agar hemat memori
  $("foto").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=320, s=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        foto=c.toDataURL("image/jpeg",0.75);
        var p=$("preview"); p.textContent=""; p.style.backgroundImage="url("+foto+")";
      };
      img.onerror=function(){ say("File bukan gambar yang valid."); };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });

  $("simpan").addEventListener("click",function(){
    var nama=$("nama").value.trim(), kota=$("kota").value.trim(),
        alamat=$("alamat").value.trim(), kontak=$("kontak").value.trim();
    if(!nama||!kota||!alamat||!kontak){ say("Lengkapi nama, asal kota, alamat, dan kontak."); return; }
    data.unshift({id:Date.now(),nama:nama,kota:kota,alamat:alamat,kontak:kontak,foto:foto,waktu:new Date().toISOString()});
    if(!persist()){ say("Tersimpan sementara, tetapi penyimpanan browser penuh atau tidak tersedia."); }
    else say(nama+" tercatat hadir.",true);
    ["nama","kota","alamat","kontak"].forEach(function(i){$(i).value=""});
    $("foto").value=""; foto="";
    var p=$("preview"); p.style.backgroundImage=""; p.textContent="Belum ada foto";
    render();
  });

  function render(){
    var q=$("cari").value.trim().toLowerCase();
    var rows=data.filter(function(d){ return !q||(d.nama+" "+d.kota+" "+d.kontak).toLowerCase().indexOf(q)>-1; });
    $("count").textContent="Peserta hadir: "+data.length+(q?" (ditampilkan "+rows.length+")":"");
    var el=$("list");
    if(!rows.length){ el.innerHTML='<div class="empty">'+(data.length?"Tidak ada hasil yang cocok.":"Belum ada peserta. Isi form untuk mencatat kehadiran pertama.")+'</div>'; return; }
    el.innerHTML=rows.map(function(d){
      var w=new Date(d.waktu).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
      var av=d.foto?'<img src="'+d.foto+'" alt="Foto '+esc(d.nama)+'">':'<div class="ph">'+esc(d.nama.charAt(0).toUpperCase())+'</div>';
      return '<div class="item">'+av+'<div class="info"><b>'+esc(d.nama)+'</b><span>'+esc(d.kota)+' · '+esc(d.kontak)+'</span><span>'+esc(d.alamat)+'</span><span>Hadir: '+w+'</span></div><button class="small del" data-id="'+d.id+'" type="button">Hapus</button></div>';
    }).join("");
  }

  $("list").addEventListener("click",function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-id"); if(!id) return;
    if(!confirm("Hapus peserta ini dari daftar?")) return;
    data=data.filter(function(d){return String(d.id)!==id});
    persist(); render();
  });
  $("cari").addEventListener("input",render);

  $("salin").addEventListener("click",function(){
    var q=function(s){return '"'+String(s).replace(/"/g,'""')+'"'};
    var csv=["Nama,Asal Kota,Alamat,Kontak,Waktu Hadir"].concat(data.map(function(d){
      return [d.nama,d.kota,d.alamat,d.kontak,d.waktu].map(q).join(",");
    })).join("\n");
    try{
      navigator.clipboard.writeText(csv).then(function(){say("Data CSV disalin. Tempel ke Excel atau Google Sheets.",true)},function(){say("Gagal menyalin data.")});
    }catch(e){ say("Gagal menyalin data."); }
  });

  render();
})();
</script>
