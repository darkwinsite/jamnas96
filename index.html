<style>
:root {
  --bg: #f3f6f4; --card: #ffffff; --ink: #17261f; --mute: #5d6e65; --line: #d5ded9; 
  --accent: #0f6b4f; --accent-ink: #ffffff; --danger: #b3261e; --warning: #d97706; --sidebar-bg: #11221b;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="emerald"] {
  --bg: #f3f6f4; --card: #ffffff; --ink: #17261f; --mute: #5d6e65; --line: #d5ded9;
  --accent: #0f6b4f; --accent-ink: #ffffff; --sidebar-bg: #11221b;
}
[data-theme="ocean"] {
  --bg: #f0f4f8; --card: #ffffff; --ink: #102a43; --mute: #486581; --line: #d9e2ec;
  --accent: #0969da; --accent-ink: #ffffff; --sidebar-bg: #0a2540;
}
[data-theme="sunset"] {
  --bg: #fff8f6; --card: #ffffff; --ink: #2d1a15; --mute: #7a5c53; --line: #f0d7d0;
  --accent: #c93b2b; --accent-ink: #ffffff; --sidebar-bg: #2b130e;
}
[data-theme="dark"] {
  --bg: #101a15; --card: #18251e; --ink: #e8f1ec; --mute: #93a69b; --line: #2b3c33; 
  --accent: #4cc79b; --accent-ink: #06261a; --danger: #ff8a80; --warning: #fbbf24; --sidebar-bg: #0b1410;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *:before, *:after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; display: flex; min-height: 100vh; transition: background 0.3s, color 0.3s; }

/* Sidebar Layout */
aside {
  width: 270px; background: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; flex: none;
  border-right: 1px solid var(--line); transition: background 0.3s;
}
.sidebar-brand { padding: 20px; font-size: 1.15rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--accent); }
.sidebar-brand span { display: block; font-size: 0.75rem; color: #93a69b; font-weight: normal; margin-top: 2px; }
.sidebar-menu { list-style: none; padding: 10px; margin: 0; }
.sidebar-menu li { margin-bottom: 4px; }
.sidebar-menu a {
  display: block; padding: 11px 15px; color: #b0c4ba; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: 0.2s;
}
.sidebar-menu a:hover, .sidebar-menu a.active { background: var(--accent); color: var(--accent-ink); }

/* Submenu Dropdown */
.submenu-container { margin-bottom: 4px; }
.submenu-toggle {
  display: flex; justify-content: space-between; align-items: center; padding: 11px 15px; color: #b0c4ba; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.2s; background: transparent; width: 100%; border: none; text-align: left;
}
.submenu-toggle:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
.submenu-toggle .arrow { transition: transform 0.2s; font-size: 0.8rem; }
.submenu-container.open .submenu-toggle .arrow { transform: rotate(180deg); }
.submenu-items { list-style: none; padding: 0 0 0 16px; margin: 4px 0 0 0; display: none; }
.submenu-container.open .submenu-items { display: block; }
.submenu-items a { padding: 8px 12px; font-size: 0.85rem; color: #93a69b; }
.submenu-items a:hover, .submenu-items a.active { background: var(--accent); color: var(--accent-ink); }

/* Main Content Layout */
.main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; font-weight: 600; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 24px; flex: 1; }

.page { display: none; }
.page.active { display: block; }

h1 { font-size: 1.7rem; margin: 0 0 4px; }
h2 { font-size: 1.3rem; margin: 0 0 12px; color: var(--accent); }
.sub { color: var(--mute); margin: 0 0 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media(min-width: 800px) { .grid { grid-template-columns: 380px 1fr; align-items: start; } }

.grid-stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 20px; }
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
.stat-card h3 { margin: 0; font-size: 1.6rem; color: var(--accent); }
.stat-card p { margin: 4px 0 0; font-size: 0.85rem; color: var(--mute); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
label { display: block; font-weight: 600; font-size: .88rem; margin: 10px 0 4px; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.photo { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.preview { width: 72px; height: 72px; border-radius: 12px; border: 1px dashed var(--line); background: var(--bg) center/cover no-repeat; display: grid; place-items: center; color: var(--mute); font-size: .75rem; text-align: center; flex: none; }
button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.full { width: 100%; justify-content: center; margin-top: 14px; padding: 11px; }
button.small { padding: 5px 10px; font-size: .82rem; }
button.del { color: var(--danger); border-color: var(--danger); }
button.edit { color: var(--warning); border-color: var(--warning); }
.msg { min-height: 1.4em; margin: 10px 0 0; font-size: .9rem; color: var(--danger); }
.msg.ok { color: var(--accent); }

.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.bar input, .bar select { flex: 1; min-width: 150px; }
.count { font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; }

/* Table Styling */
.table-responsive { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: var(--bg); font-weight: 600; color: var(--mute); }
tr:last-child td { border-bottom: none; }
.avatar-cell { display: flex; align-items: center; gap: 10px; }
.avatar-cell img, .avatar-cell .ph { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--bg); display: grid; place-items: center; font-weight: 700; color: var(--mute); flex: none; }

/* Drag Drop Zone */
.drop-zone { border: 2px dashed var(--line); border-radius: 12px; padding: 30px; text-align: center; background: var(--bg); cursor: pointer; transition: 0.2s; }
.drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background: rgba(15, 107, 79, 0.05); }

/* WordPress CMS Toolbar & Editable Elements */
.cms-toolbar {
  background: #1e1e1e; color: #fff; padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; display: none; gap: 6px; flex-wrap: wrap; align-items: center;
}
.cms-toolbar.active { display: flex; }
